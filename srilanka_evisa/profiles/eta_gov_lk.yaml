# Site profile for the Sri Lanka ETA portal (https://eta.gov.lk/slvisa/).
#
# Every element is located by trying, in order:
#   1. `selectors`  - CSS selectors (first match wins)
#   2. `labels`     - regexes matched against the field's <label> (EN + FR)
#   3. `texts`      - regexes matched against button / link captions (clickables only)
# so the automation keeps working in either locale and survives small markup
# changes. If the portal changes, run with --headful --debug, look at the saved
# HTML in the output folder and adjust the selectors here - no code change needed.
#
# `kind` is inferred from the element when omitted (select / checkbox / radio /
# file / date / text). `value_map` translates our canonical values into the
# option texts/values the site may use. `required: false` skips a field quietly
# when it is not on the page.

name: Sri Lanka ETA (eta.gov.lk)
start_path: "/slvisa/visainfo/center.jsp?locale={locale}"
date_format: "%d/%m/%Y"

# How to tell we reached the external payment gateway.
payment_url_patterns: ["ipg", "payment", "paycorp", "gateway", "checkout", "mastercard", "pay"]

captcha:
  selectors: ["img[src*='captcha' i]", "iframe[src*='recaptcha']", ".g-recaptcha", "iframe[src*='hcaptcha']"]
  # Text box to type the captcha answer in, when it is an image captcha.
  input: {selectors: ["input[name*='captcha' i]", "#captcha"], labels: ["captcha", "code de sécurité", "security code"]}

error_banner:
  selectors: [".error:visible", ".alert-danger:visible", "#errorMsg:visible", ".errorMessage:visible"]

reference_regex: "\\b(?:ETA|REF)[-_ ]?[A-Z0-9]{6,}\\b|\\b[A-Z]{2}\\d{8,}\\b"

steps:
  start:
    click:
      selectors: ["a[href*='apply.jsp']", "a[href*='etaNavServ']"]
      texts: ["^\\s*Apply( for (a|an) (visa|ETA))?\\s*$", "Demander (un )?(visa|ETA)", "Faire une demande", "^\\s*Postuler"]

  eligibility:
    fields:
      visa_type:
        selectors: ["select[name='visaType']", "#visaType"]
        labels: ["^\\s*(Visa type|Type de visa)", "Catégorie", "Category"]
        value_map:
          tourist: ["TOURIST", "Tourist", "Touris", "Tourisme", "Tourist ETA"]
          business: ["BUSINESS", "Business", "Affaires"]
          transit: ["TRANSIT", "Transit"]
      application_type:
        kind: radio
        options:
          individual:
            selectors: ["input[name='appType'][value='individual' i]", "input[value='INDIVIDUAL']"]
            labels: ["^\\s*(Individual|Individuelle?)\\b"]
          group:
            selectors: ["input[name='appType'][value='group' i]", "input[value='GROUP']"]
            labels: ["^\\s*(Group|Groupe)\\b"]
      accept_terms:
        kind: checkbox
        selectors: ["input[name='agree']", "#agree", "input[name*='terms' i]"]
        labels: ["(I )?(agree|accept)", "J'accepte", "conditions"]
    next:
      selectors: ["#btnNext", "input[type=submit][name='next']"]
      texts: ["^\\s*(Next|Suivant|Continue|Continuer)\\b"]

  trip:
    fields:
      purpose:
        required: false
        labels: ["Purpose of (visit|travel)", "(Motif|But) du (voyage|séjour|visite)"]
        value_map:
          Tourism: ["Tourism", "Sightseeing", "Tourisme", "Holiday", "Vacances"]
      arrival_date:
        selectors: ["#arrivalDate", "input[name='arrivalDate']"]
        labels: ["(Intended )?(date of )?arrival", "Date (prévue )?d'arrivée"]
      duration_days:
        selectors: ["#stayDays", "input[name='stayDays']"]
        labels: ["(Duration|Length) of stay", "Durée du séjour"]
      mode_of_travel:
        required: false
        labels: ["Mode of travel", "Moyen de transport", "Mode de (voyage|transport)"]
        value_map:
          Air: ["AIR", "Air", "By Air", "Avion", "Aérien"]
          Sea: ["SEA", "Sea", "By Sea", "Mer", "Maritime"]
      port_of_departure:
        required: false
        labels: ["Port of departure", "(Port|Lieu|Aéroport) de départ"]
      flight_number:
        required: false
        labels: ["(Airline|Flight|Vessel).*(No|number)", "N(°|o|uméro) de vol"]
      address_in_sri_lanka:
        labels: ["Address in Sri Lanka", "Adresse au Sri Lanka"]
      email:
        labels: ["^\\s*E-?mail", "Courriel", "Adresse (e-mail|électronique)"]
      email_confirm:
        required: false
        labels: ["(Confirm|Re-?enter).*e-?mail", "Confirme[rz].*(e-?mail|courriel)"]
      phone:
        labels: ["(Mobile|Telephone|Phone)", "(Téléphone|Portable|Mobile)"]
      contact_address:
        required: false
        labels: ["(Contact|Postal|Mailing) address", "Adresse (de contact|postale)"]
    next:
      texts: ["^\\s*(Next|Suivant|Continue|Continuer)\\b"]

  beneficiary:
    fields:
      title:
        required: false
        labels: ["^\\s*(Title|Titre|Civilité)"]
        value_map:
          Mr: ["Mr", "Mr.", "M.", "Monsieur"]
          Mrs: ["Mrs", "Mrs.", "Mme", "Madame"]
          Ms: ["Ms", "Ms.", "Miss", "Mlle", "Mme", "Madame"]
          Master: ["Master", "Mstr", "Mr", "M."]
      surname:
        selectors: ["#surname", "input[name='surname']"]
        labels: ["^\\s*(Surname|Family name|Last name|Nom de famille)", "^\\s*Nom\\b"]
      given_names:
        selectors: ["#otherNames", "input[name='otherNames']"]
        labels: ["(Other|Given|First) names?", "Prénoms?"]
      date_of_birth:
        labels: ["Date of birth", "Date de naissance"]
      sex:
        labels: ["^\\s*(Gender|Sex|Sexe|Genre)"]
        value_map:
          M: ["M", "MALE", "Male", "Masculin", "Homme"]
          F: ["F", "FEMALE", "Female", "Féminin", "Femme"]
      nationality:
        labels: ["^\\s*(Nationality|Nationalité)"]
        value_map: countries
      country_of_birth:
        required: false
        labels: ["Country of birth", "Pays de naissance"]
        value_map: countries
      occupation:
        required: false
        labels: ["Occupation", "Profession"]
      passport_number:
        labels: ["Passport (No|number)", "N(°|uméro) (de|du) passeport"]
      passport_issuing_country:
        required: false
        labels: ["(Issuing country|Country of issue|Place of issue)", "Pays de délivrance", "Lieu de délivrance"]
        value_map: countries
      passport_issue_date:
        labels: ["(Passport )?(date of )?issue( date)?", "Date de délivrance"]
      passport_expiry_date:
        labels: ["(Passport )?(date of )?expir", "Date d'expiration"]
      home_address:
        required: false
        labels: ["(Home|Residential|Permanent) address", "Adresse (du domicile|permanente|de résidence)"]
      passport_image:
        kind: file
        required: false
        selectors: ["input[type=file][name*='passport' i]"]
        labels: ["(Passport|bio).*(copy|page|scan|upload)", "(Copie|Scan|Page).*(passeport)"]
      photo:
        kind: file
        required: false
        selectors: ["input[type=file][name*='photo' i]"]
        labels: ["^\\s*Photo", "Photographie", "Photo d'identité"]
    add_another:
      texts: ["Add (another )?(member|applicant|person)", "Ajouter (un )?(autre )?(membre|demandeur|voyageur)"]
    next:
      texts: ["^\\s*(Next|Suivant|Continue|Continuer)\\b"]

  review:
    fields:
      declaration:
        kind: checkbox
        required: false
        labels: ["(I )?(declare|certify|confirm)", "Je (déclare|certifie|confirme)"]
    submit:
      texts: ["^\\s*(Confirm|Submit|Confirmer|Soumettre|Valider)"]

  confirmation:
    pay:
      texts: ["Pay (now|online)?", "Payer( maintenant| en ligne)?", "Proceed to payment", "Procéder au paiement"]

payment_gateway:
  # Hosted payment pages often render card inputs in iframes; all frames are searched.
  fields:
    card_holder:
      required: false
      selectors: ["input[autocomplete='cc-name']", "input[name*='holder' i]", "input[name*='cardName' i]"]
      labels: ["(Card ?holder|Name on card)", "(Titulaire|Nom sur la carte)"]
    card_number:
      selectors: ["input[autocomplete='cc-number']", "input[name*='cardNumber' i]", "input[name*='cardno' i]", "#cardNumber"]
      labels: ["Card number", "Numéro de (la )?carte"]
    expiry_month:
      required: false
      selectors: ["select[name*='month' i]", "input[name*='month' i]", "input[autocomplete='cc-exp-month']"]
      labels: ["(Expiry )?month", "Mois"]
    expiry_year:
      required: false
      selectors: ["select[name*='year' i]", "input[name*='year' i]", "input[autocomplete='cc-exp-year']"]
      labels: ["(Expiry )?year", "Année"]
    expiry:
      required: false
      selectors: ["input[autocomplete='cc-exp']", "input[name*='expiry' i]", "input[placeholder*='MM/YY' i]"]
      labels: ["(Expiry|Expiration) date", "Date d'expiration"]
    cvv:
      selectors: ["input[autocomplete='cc-csc']", "input[name*='cvv' i]", "input[name*='cvc' i]", "input[name*='csc' i]", "input[name*='securityCode' i]"]
      labels: ["(CVV|CVC|CSC|Security code)", "Cryptogramme"]
  submit:
    texts: ["^\\s*(Pay|Payer|Submit|Valider|Confirm)"]
  success_regex: "(approved|successful|success|réussi|accepté|confirmed)"
  failure_regex: "(declined|failed|refusé|échec|error|erreur)"
