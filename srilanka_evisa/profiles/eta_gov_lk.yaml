# Site profile for the Sri Lanka ETA portal (https://eta.gov.lk/etaslvisa/).
#
# Element lookup order: `selectors` (CSS) -> `labels` (regex on the field's
# label) -> `texts` (regex on button/link captions). `kind` is inferred from the
# element (select / checkbox / radio / date / text) unless given. `value_map`
# turns our canonical values into what the site uses; `required: false` skips a
# field quietly when it is absent.
#
# Mapped from the live site on 2026-09-25 (snapshots in mock_site/portal_snapshot/):
#   VERIFIED    terms page, category page, individual form, group trip/contact form,
#               group member form, review pages (live dry runs 2026-09-25)
#   UNVERIFIED  payment options, gateway - those
#               pages only appear after submitting real data. They use generic
#               selectors + text matching; check them on your first --headful run.

name: Sri Lanka ETA (eta.gov.lk)
start_path: "/etaslvisa/pages/termnconuser.jsp?ucode=123"
# The portal redirects to plain http:// mid-flow; keep the session on https.
force_https: true
date_format: "%m-%d-%Y"

# Alerts/pages meaning the whole session is dead.
fatal_texts: ["Session Expired"]

# How to tell we reached the external payment gateway (URL substrings).
payment_url_patterns: ["ipg", "payment", "paycorp", "gateway", "checkout", "mastercard", "sampath", "boc", "hnb", "pay"]

captcha:
  # The portal loads reCAPTCHA but its check is currently commented out.
  selectors: ["iframe[src*='recaptcha/api2/anchor']", ".g-recaptcha:visible", "iframe[src*='hcaptcha']"]

error_banner:
  selectors: ["span.error:visible:not(:empty)", ".alert-danger:visible"]

# Reference shown after submission (first capture group is used when present).
reference_regex: "(?:ETA\\s*)?(?:Reference|Ref\\.?|Application)\\s*(?:No\\.?|Number)?\\s*[:\\-]?\\s*([A-Z0-9][A-Z0-9-]{5,})"

steps:
  terms:
    click:
      selectors: ["input[name='terms'][value='yes']"]
      labels: ["I Agree"]

  category:
    # ids of the <a> links on the "Online Visa Application" page
    link_ids:
      tourist: {individual: "1", group: "2"}
      business: {individual: "21", group: "32"}
      transit: {individual: "5", group: "6"}

  # One page with the applicant, travel, address, contact and declarations.
  individual_form:
    fields: &person_fields
      surname:
        selectors: ["#surname"]
        labels: ["^\\s*Surname"]
      given_names:
        selectors: ["#othernames"]
        labels: ["Other/Given Names"]
      title:
        selectors: ["#title"]
        value_map: &titles
          MR: ["MR"]
          MRS: ["MRS"]
          MS: ["MS"]
          MISS: ["MISS"]
          MASTER: ["MASTER"]
          DR: ["DR"]
          REV: ["REV"]
      date_of_birth:
        selectors: ["#bdate"]
      date_of_birth_confirm:
        selectors: ["#reenteredbdate"]
      sex:
        selectors: ["#gender"]
        value_map: &genders
          M: ["Male"]
          F: ["Female"]
      nationality:
        selectors: ["#national"]
        value_map: countries
      country_of_birth:
        selectors: ["#conbirth"]
        value_map: countries
      occupation:
        required: false
        selectors: ["#occupation"]
      passport_number:
        selectors: ["#passportno"]
        # onchange asks the server to check number + nationality, then sets this flag
        wait_for: "#idHiddenPassOk[value='1']"
      passport_number_confirm:
        selectors: ["#reenteredpassportno"]
      passport_issue_date:
        selectors: ["#pidate"]
      passport_expiry_date:
        selectors: ["#pedate"]
      departure_country:
        selectors: ["#fromDeparture"]
        value_map: countries
      visa_days:
        selectors: ["#RequestedVisaDays"]
      arrival_date:
        selectors: ["#iadate"]
      purpose:
        selectors: ["#puofvisit"]
        value_map: &purposes
          Tourism: ["V01", "Sightseeing or Holidaying"]
          Visiting: ["V02", "Visiting friends and relatives"]
          Medical: ["V03", "Medical treatment including Ayurvedic (herbal)"]
          MICE: ["V10"]
          Wedding: ["V11", "Participate in Weddings"]
          Pilgrimage: ["V12", "Participate in Pilgrimages"]
          Sport: ["V13", "Participate in Sport Events"]
          Arts: ["V14", "Participate in Art, Music, and Dance Events"]
      port_of_departure: {required: false, selectors: ["#depcity"]}
      airline: {required: false, selectors: ["#airline"]}
      flight_number: {required: false, selectors: ["#flightno"]}
      address_line1: {selectors: ["#addone"]}
      address_line2: {required: false, selectors: ["#addtwo"]}
      city: {selectors: ["#city"]}
      state: {selectors: ["#state"]}
      postal_code: {required: false, selectors: ["#zipcode"]}
      country:
        selectors: ["#adcountry"]
        value_map: countries
      address_in_sri_lanka: {selectors: ["#addinsl"]}
      email: {selectors: ["#email"]}
      email_confirm: {selectors: ["#reenteremail"]}
      telephone: {selectors: ["#telephon"]}
      mobile: {required: false, selectors: ["#mobileno"]}
      q_residence_visa: &q1
        kind: radio
        options:
          "yes": {selectors: ["#vlrYQN1"]}
          "no": {selectors: ["#vlrNQN1"]}
      q_currently_in_sri_lanka: &q2
        kind: radio
        options:
          "yes": {selectors: ["#vlrYQN2"]}
          "no": {selectors: ["#vlrNQN2"]}
      q_multiple_entry_visa: &q3
        kind: radio
        options:
          "yes": {selectors: ["#vlrYQN3"]}
          "no": {selectors: ["#vlrNQN3"]}
      confirm_info: &conf
        kind: checkbox
        selectors: ["input[name='conf']"]
    next:
      selectors: ["#submitButton"]
      texts: ["^\\s*Next\\s*$"]

  # Group page 1: travel + contact details shared by every member.
  group_form:
    fields:
      departure_country: {selectors: ["#idfromDeparture"], value_map: countries}
      visa_days: {selectors: ["#RequestedVisaDays"]}
      arrival_date: {selectors: ["#idArrivalDate"]}
      purpose: {selectors: ["#idPuofvisit"], value_map: *purposes}
      port_of_departure: {required: false, selectors: ["#idDepcity"]}
      airline: {required: false, selectors: ["#idAirline"]}
      flight_number: {required: false, selectors: ["#idFlightno"]}
      address_line1: {selectors: ["#idContAddOne"]}
      address_line2: {required: false, selectors: ["#idContAddTwo"]}
      city: {selectors: ["#idContCity"]}
      state: {selectors: ["#idContState"]}
      postal_code: {required: false, selectors: ["#idContZipCode"]}
      country: {selectors: ["#idConCountry"], value_map: countries}
      telephone: {selectors: ["#idContPhoneNo"]}
      mobile: {required: false, selectors: ["#idContMobileno"]}
      email: {selectors: ["#idContEmail"]}
      email_confirm: {selectors: ["#idReEnterEmail"]}
      address_in_sri_lanka: {required: false, selectors: ["#idContactAddSL"]}
    next:
      selectors: ["input[name='next'][onclick*='validateGroupForm1']"]
      texts: ["^\\s*Next\\s*$"]

  # Group page 2: one member form, reused for every member. "Add Member" checks the
  # member in the browser and adds them to a list on the same page (no page load);
  # after the first one the portal adds a "Next" button that posts the whole group.
  member_form:
    fields:
      surname: {selectors: ["#idSurname"]}
      given_names: {selectors: ["#idOthernames"]}
      title: {selectors: ["#idTitle"], value_map: *titles}
      date_of_birth: {selectors: ["#idDobDate"]}
      date_of_birth_confirm: {selectors: ["#idReEnteredDobDate"]}
      sex: {selectors: ["#idGender"], value_map: *genders}
      nationality: {selectors: ["#idNatinality"], value_map: countries}
      country_of_birth: {selectors: ["#idCOB"], value_map: countries}
      country_of_address: {selectors: ["#idCOA"], value_map: countries}
      occupation: {required: false, selectors: ["#idOccupation"]}
      passport_number:
        selectors: ["#idPassportNo"]
        # onchange asks the server about number + nationality and shows a spinner
        # until it answers (#idHiddenPassOk stays 1 after the first member, so it
        # can't be used here). A refusal is an alert() that clears the number.
        wait_for: "#idLodingPassPort:not(:has(img))"
      passport_number_confirm: {selectors: ["#idReEnteredPassportNo"]}
      passport_issue_date: {selectors: ["#idPassIsueDate"]}
      passport_expiry_date: {selectors: ["#idPassExpDate"]}
      q_residence_visa: *q1
      q_currently_in_sri_lanka: *q2
      q_multiple_entry_visa: *q3
      confirm_info: {kind: checkbox, selectors: ["#idConfTick"]}
    add:
      selectors: ["#idAddMember"]
      texts: ["^\\s*Add Member\\s*$"]
    # appears once member n (1-based) is in the list
    added: "#hiddenPassportNo{n}"
    next:
      selectors: ["#idSumfB input[value='Next']"]

  # Review page ("2. Review Information"). Group: #idConform ->
  # submittionOfForm3Group(this,'3'), one confirm(). Individual:
  # confirmForm(), two confirm() dialogs (the second is the fraud declaration).
  review:
    submit:
      selectors: ["#idConform", "input[onclick*='confirmForm']", "button[onclick*='confirmForm']"]
      texts: ["^\\s*Confirm\\s*$"]

  # UNVERIFIED: payment options page ("3. Payment Options").
  payment_options:
    fields:
      method:
        kind: radio
        required: false
        options:
          card: {labels: ["(Credit|Debit|Visa|Master ?Card|Card)"]}
    pay:
      texts: ["^\\s*Pay( Now| Online)?\\s*$", "Proceed to (Payment|Pay)", "^\\s*(Next|Proceed|Continue)\\s*$"]

payment_gateway:
  # Hosted payment pages often render card inputs in iframes; all frames are searched.
  fields:
    card_holder:
      required: false
      selectors: ["input[autocomplete='cc-name']", "input[name*='holder' i]", "input[name*='cardName' i]"]
      labels: ["(Card ?holder|Name on card)", "(Titulaire|Nom sur la carte)"]
    card_number:
      selectors: ["input[autocomplete='cc-number']", "input[name*='cardNumber' i]", "input[name*='cardno' i]", "#cardNumber"]
      labels: ["Card number", "Numéro de (la )?carte"]
    expiry_month:
      required: false
      selectors: ["select[name*='month' i]", "input[name*='month' i]", "input[autocomplete='cc-exp-month']"]
      labels: ["(Expiry )?month", "Mois"]
    expiry_year:
      required: false
      selectors: ["select[name*='year' i]", "input[name*='year' i]", "input[autocomplete='cc-exp-year']"]
      labels: ["(Expiry )?year", "Année"]
    expiry:
      required: false
      selectors: ["input[autocomplete='cc-exp']", "input[name*='expiry' i]", "input[placeholder*='MM/YY' i]"]
      labels: ["(Expiry|Expiration) date", "Date d'expiration"]
    cvv:
      selectors: ["input[autocomplete='cc-csc']", "input[name*='cvv' i]", "input[name*='cvc' i]", "input[name*='csc' i]", "input[name*='securityCode' i]"]
      labels: ["(CVV|CVC|CSC|Security code)", "Cryptogramme"]
  submit:
    texts: ["^\\s*(Pay|Payer|Submit|Valider|Confirm)"]
  success_regex: "(approved|successful|success|réussi|accepté|confirmed)"
  failure_regex: "(declined|failed|refusé|échec|error|erreur)"
