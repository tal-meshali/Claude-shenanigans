[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evisa-automation"
version = "0.1.0"
description = "Browser automation for e-visa portals (Tanzania, Sri Lanka) with a shared, country-agnostic core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.5",
    "pillow>=10.0",
    "pycountry>=22.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evisa = "evisa.cli:main"

[tool.setuptools.packages.find]
include = ["evisa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: drives a real Chromium against the local mock portals"]
